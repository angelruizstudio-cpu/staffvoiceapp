<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#164b44">
    <title>Authorized Users | Staff Voice</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/admin" aria-label="Staff Voice admin">
        <img src="/assets/wts-seal.png" alt="" onerror="this.src='/icons/icon.svg'">
        <span>Staff Voice</span>
      </a>
      <nav aria-label="Primary">
        <a href="/admin">Cases</a>
        <a href="/users" aria-current="page">Users</a>
        <button class="nav-button" id="logoutButton" type="button">Sign out</button>
      </nav>
    </header>

    <main>
      <section class="admin-hero users-hero">
        <p class="eyebrow">Internal access</p>
        <h1>Manage authorized users.</h1>
        <p class="lead">Owners can add HR reviewers, reset passwords, and control who has access to the Staff Voice case workspace.</p>
      </section>

      <section class="hr-section" id="users">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Access control</p>
            <h2>Authorized users</h2>
          </div>
          <span class="step-pill" id="currentUserPill">Loading access</span>
        </div>

        <form class="user-form hidden" id="userForm">
          <label>
            Email
            <input name="email" type="email" required placeholder="name@example.org">
          </label>
          <label>
            Name
            <input name="name" type="text" placeholder="Optional">
          </label>
          <label>
            Role
            <select name="role">
              <option value="hr">HR reviewer</option>
              <option value="owner">Owner</option>
            </select>
          </label>
          <label>
            Password
            <input name="password" type="password" minlength="10" placeholder="Set or reset">
          </label>
          <button class="secondary-button" type="submit">Add or update user</button>
        </form>

        <div class="report-list" id="userList" aria-live="polite"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/users.js?v=24"></script>
  </body>
</html>
