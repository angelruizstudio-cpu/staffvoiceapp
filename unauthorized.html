<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access required | Staff Voice</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #edf5f2;
        color: #142421;
      }

      .access-page {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      .access-panel {
        width: min(520px, 100%);
        padding: 34px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #d8e2df;
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(18, 36, 33, 0.12);
      }

      .access-panel img {
        display: block;
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
      }

      .access-panel p {
        color: #5b6c68;
        line-height: 1.55;
      }

      .link-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        margin-top: 12px;
        padding: 0 18px;
        color: #ffffff;
        background: #164b44;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main class="access-page">
      <section class="access-panel">
        <img src="/assets/wts-seal.png" alt="Western Theological Seminary seal" onerror="this.src='/icons/icon.svg'">
        <h1>HR access required</h1>
        <p>This area is reserved for HR reviewers. Ask the Azure Static Web App owner to assign your account the <strong>hr</strong> role.</p>
        <a class="submit-button link-button" href="/">Return to Staff Voice</a>
      </section>
    </main>
  </body>
</html>
